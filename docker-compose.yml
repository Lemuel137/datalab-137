services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: datalab
      POSTGRES_PASSWORD: datalab
      POSTGRES_DB: datalab137
    ports:
      - "5433:5432"
    volumes:
      - datalab137-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalab -d datalab137"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datalab137-pg:
